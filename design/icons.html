<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOG.ai icon options</title>
<style>
:root{--page:#131418;--card:#1b1d22;--line:#2d3038;--text:#e8e9ec;--muted:#9097a3;--amber:#f2a93b;--terra:#e08a5c;--blue:#6cb2ff}
@media (prefers-color-scheme:light){:root{--page:#f3f4f6;--card:#fff;--line:#d9dce2;--text:#1b1e23;--muted:#5d6673}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;padding:24px 16px 40px}
h1{font-size:1.5em;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 20px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0;font-size:1.1em}
.card p{margin:2px 0 12px;color:var(--muted);min-height:3em}
.row{display:flex;gap:10px;align-items:stretch}
.tile{flex:1;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line)}
.tile svg{width:62%;height:62%}
.t-dark{background:#16181c;color:var(--amber);--cut:#16181c}
.t-light{background:#f6f0e6;color:#a8481f;--cut:#f6f0e6}
.t-app{background:linear-gradient(145deg,#7fbcff,#4f8fe8);color:#12102a;--cut:#6aa9f5;border-radius:24%;border:0}
.sizes{display:flex;align-items:center;gap:14px;margin-top:12px;padding:8px 10px;border-radius:8px;background:#16181c;color:#e6e8eb;--cut:#16181c}
.sizes span{font-size:12px;color:#8d95a2;margin-left:auto}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;border-radius:8px;background:#fff;color:#1b1e23;--cut:#fff;border:1px solid #d9dce2;font-size:12px}
.bar i{margin-left:auto;font-style:normal;color:#777;letter-spacing:8px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-pointy" viewBox="0 0 64 64">
      <path fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round" d="M15 5 26 19h12L49 5l1 25-9 23q-9 6-18 0l-9-23Z"/>
      <circle cx="25" cy="30" r="2.800" fill="var(--cut)"/><circle cx="39" cy="30" r="2.800" fill="var(--cut)"/>
      <ellipse cx="32" cy="49.500" rx="5.200" ry="3.800" fill="var(--cut)"/>
    </symbol>
    <symbol id="i-floppy" viewBox="0 0 64 64">
      <ellipse cx="10.500" cy="29" rx="5.500" ry="13" transform="rotate(10 10.500 29)" fill="currentColor"/>
      <ellipse cx="53.500" cy="29" rx="5.500" ry="13" transform="rotate(-10 53.500 29)" fill="currentColor"/>
      <path fill="currentColor" d="M32 11c10 0 14 8 14 20 0 14-6 24-14 24S18 45 18 31c0-12 4-20 14-20Z"/>
      <circle cx="26.500" cy="29" r="2.600" fill="var(--cut)"/><circle cx="37.500" cy="29" r="2.600" fill="var(--cut)"/>
      <ellipse cx="32" cy="44" rx="8" ry="6.500" fill="var(--cut)"/>
      <ellipse cx="32" cy="41.500" rx="3.400" ry="2.500" fill="currentColor"/>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 64 64">
      <path fill="currentColor" d="M22 11h20a10 10 0 0 1 10 10v16a10 10 0 0 1-10 10H32L18 58l3-11.100A10 10 0 0 1 12 37V21a10 10 0 0 1 10-10Z"/>
      <g fill="currentColor" stroke="var(--cut)" stroke-width="2.600" stroke-linejoin="round">
        <path d="M24 9C12 6 3 14 4 28c.500 7 7 9 10 3 1-7 3-13 10-17Z"/>
        <path d="M40 9c12-3 21 5 20 19-.500 7-7 9-10 3-1-7-3-13-10-17Z"/>
      </g>
      <circle cx="24" cy="27" r="3" fill="var(--cut)"/><circle cx="40" cy="27" r="3" fill="var(--cut)"/>
      <ellipse cx="32" cy="36" rx="4.200" ry="3.200" fill="var(--cut)"/>
    </symbol>
    <symbol id="i-mono" viewBox="0 0 64 64">
      <path fill="currentColor" d="M13 9h19c14 0 23 10 23 23s-9 23-23 23H13Z"/>
      <path fill="currentColor" stroke="var(--cut)" stroke-width="3.500" stroke-linejoin="round" d="M13 9h17l-9 23-8-3Z"/>
      <circle cx="35" cy="26" r="3.200" fill="var(--cut)"/>
      <path stroke="var(--cut)" stroke-width="3.500" stroke-linecap="round" d="M55 37H42"/>
      <circle cx="51.500" cy="29" r="2.600" fill="var(--cut)"/>
    </symbol>
    <symbol id="i-line" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="4.200" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 57V31Q18 10 33 10q8 0 10 11l14 5v8.500H45Q44 43 37 46v11"/>
        <path d="M26 13q-9 10-5 26 8-2 10-14"/>
      </g>
      <circle cx="38" cy="21.500" r="2.300" fill="currentColor"/>
      <circle cx="55.500" cy="28" r="3" fill="currentColor"/>
    </symbol>
    <symbol id="i-tag" viewBox="0 0 64 64">
      <circle cx="32" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="3.500"/>
      <circle cx="32" cy="37" r="21" fill="currentColor"/>
      <path fill="var(--cut)" d="M32 22c1.200 9 4.500 12.300 14 15-9.500 2.700-12.800 6-14 15-1.200-9-4.500-12.300-14-15 9.500-2.700 12.800-6 14-15Z"/>
    </symbol>
  </defs>
</svg>

<h1>DOG.ai icon options</h1>
<p class="lede">Six directions. Each is shown in the Workbench amber on dark, the Fireside terracotta on paper, and as a Windows app tile, then at the small sizes it has to survive: 16, 24 and 32 pixels, and in a title bar.</p>

<div class="grid" id="grid"></div>

<script>
const ICONS = [
  ['pointy', '1 · Alert', 'Tall pricked ears and a long tapering muzzle, like a shepherd seen head-on. Reads as "watchdog".'],
  ['floppy', '2 · Floppy', 'Rounded head, drooping ears, pale muzzle. The friendliest; suits Playhouse most.'],
  ['chat', '3 · Chat Hound', 'A speech bubble with floppy ears. The three dots are both a typing indicator and a face.'],
  ['mono', '4 · D-Dog', 'A capital D that is also a dog in profile: folded ear, eye, nose, mouth. Works as a monogram.'],
  ['line', '5 · Profile', 'A line drawing of a head in profile with a hanging ear. The most restrained and grown-up.'],
  ['tag', '6 · Dog Tag', 'A collar tag stamped with a spark. No face at all; the most abstract and logo-like.']
];
const use = (id, size) => `<svg ${size ? `width="${size}" height="${size}"` : ''} aria-hidden="true"><use href="#i-${id}"/></svg>`;
document.getElementById('grid').innerHTML = ICONS.map(([id, name, why]) => `
  <section class="card">
    <h2>${name}</h2><p>${why}</p>
    <div class="row">
      <div class="tile t-dark">${use(id)}</div>
      <div class="tile t-light">${use(id)}</div>
      <div class="tile t-app">${use(id)}</div>
    </div>
    <div class="sizes">${use(id, 16)}${use(id, 24)}${use(id, 32)}<span>16 · 24 · 32 px</span></div>
    <div class="bar">${use(id, 16)}DOG.ai<i>─☐✕</i></div>
  </section>`).join('');
</script>
</body>
</html>
